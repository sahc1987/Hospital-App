# SonarCloud analysis settings.
#
# The Flyway migrations are PostgreSQL, but Sonar analyzes *.sql with its Oracle PL/SQL rules
# (e.g. "use VARCHAR2"), and following those would break the schema. Applied migrations also
# can't be edited without breaking Flyway's checksums.
# Note: this also hides the two "bcrypt hash in code" findings in V1/V4. Those are the
# documented demo accounts (password Admin@123, see README) and must be changed before any
# real deployment.
sonar.exclusions=backend/src/main/resources/db/migration/**
